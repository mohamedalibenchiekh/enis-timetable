# Optional: run PostgreSQL in Docker instead of installing it.  →  docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: enis
      POSTGRES_PASSWORD: enis
      POSTGRES_DB: enis_timetable
    ports: ["127.0.0.1:5432:5432"]
    volumes: [enis_pg:/var/lib/postgresql/data]
volumes:
  enis_pg:
