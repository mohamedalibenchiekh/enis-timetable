name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Verify tag matches package.json version ────────────────────────
  verify-version:
    name: Verify tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches apps/desktop/package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $PKG_VERSION"
            exit 1
          fi

  # ── Build installers per OS ────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: --win
            artifact-name: installer-windows
            update-metadata: latest.yml
            installer-pattern: '*.exe'
          - os: macos-latest
            builder-args: --mac
            artifact-name: installer-macos
            update-metadata: latest-mac.yml
            installer-pattern: '*.dmg'
          - os: ubuntu-latest
            builder-args: --linux
            artifact-name: installer-linux
            update-metadata: latest-linux.yml
            installer-pattern: '*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build -w apps/desktop
      - run: npm run stage -w apps/desktop
      - name: Build installer
        working-directory: apps/desktop
        env:
          # Signing certificates are optional — builds are unsigned by default.
          # Set CSC_LINK and CSC_KEY_PASSWORD as repository secrets for signed builds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --publish never ${{ matrix.builder-args }}
      - name: Verify installer and update metadata
        shell: bash
        run: |
          cd apps/desktop/release
          if [ ! -f "${{ matrix.update-metadata }}" ]; then
            echo "::error::Missing ${{ matrix.update-metadata }} update metadata"
            exit 1
          fi
          if ! compgen -G "${{ matrix.installer-pattern }}" > /dev/null; then
            echo "::error::Missing installer matching ${{ matrix.installer-pattern }}"
            exit 1
          fi
          UPDATE_METADATA="${{ matrix.update-metadata }}" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const metadata = process.env.UPDATE_METADATA;
          const text = fs.readFileSync(metadata, 'utf8');
          const references = [...text.matchAll(/^\s+(?:url|path):\s*["']?([^"'\s]+)["']?\s*$/gm)]
            .map((match) => match[1]);
          if (references.length === 0) {
            console.error(`::error::${metadata} contains no update asset references`);
            process.exit(1);
          }
          for (const reference of references) {
            const assetName = path.basename(new URL(reference, 'https://updates.invalid/').pathname);
            if (/\s/.test(assetName) || !fs.existsSync(assetName)) {
              console.error(`::error::${metadata} references a missing or invalid asset: ${reference}`);
              process.exit(1);
            }
          }
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  # ── Create GitHub Release ──────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lR release-artifacts
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## ⚠️ Note on code signing
            Unless repository signing certificates (`CSC_LINK`) are configured, these builds are **unsigned**:
            - **Windows**: If SmartScreen warns, click *More info* → *Run anyway*.
            - **macOS**: You may need to right-click → Open and confirm.
          files: release-artifacts/*
