name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Verify tag matches package.json version ────────────────────────
  verify-version:
    name: Verify tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches apps/desktop/package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $PKG_VERSION"
            exit 1
          fi

  # ── Build installers per OS ────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: --win
            artifact-name: installer-windows
            update-metadata: latest.yml
            installer-pattern: '*.exe'
          - os: macos-latest
            builder-args: --mac
            artifact-name: installer-macos
            update-metadata: latest-mac.yml
            installer-pattern: '*.dmg'
          - os: ubuntu-latest
            builder-args: --linux
            artifact-name: installer-linux
            update-metadata: latest-linux.yml
            installer-pattern: '*.AppImage'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build -w apps/desktop
      - run: npm run stage -w apps/desktop
      - name: Build unsigned installer
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --publish never ${{ matrix.builder-args }}
      - name: Verify installer and update metadata
        shell: bash
        run: |
          cd apps/desktop/release
          if [ ! -f "${{ matrix.update-metadata }}" ]; then
            echo "::error::Missing ${{ matrix.update-metadata }} update metadata"
            exit 1
          fi
          if ! compgen -G "${{ matrix.installer-pattern }}" > /dev/null; then
            echo "::error::Missing installer matching ${{ matrix.installer-pattern }}"
            exit 1
          fi
          UPDATE_METADATA="${{ matrix.update-metadata }}" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const metadata = process.env.UPDATE_METADATA;
          const text = fs.readFileSync(metadata, 'utf8');
          const references = [...text.matchAll(/^[ \t]*(?:-[ \t]*)?(?:url|path):[ \t]*["']?([^"'\s]+)["']?[ \t]*$/gm)]
            .map((match) => match[1]);
          if (references.length === 0) {
            console.error(`::error::${metadata} contains no update asset references`);
            process.exit(1);
          }
          for (const reference of references) {
            const assetName = path.basename(new URL(reference, 'https://updates.invalid/').pathname);
            if (/\s/.test(assetName) || !fs.existsSync(assetName)) {
              console.error(`::error::${metadata} references a missing or invalid asset: ${reference}`);
              process.exit(1);
            }
          }
          NODE
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/desktop/release/${{ matrix.installer-pattern }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  # ── Create GitHub Release ──────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lR release-artifacts
      - name: Generate SHA-256 checksums and release body
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          shopt -s nullglob
          installers=( *.exe *.dmg *.AppImage )
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No installer assets were downloaded"
            exit 1
          fi
          printf '%s\0' "${installers[@]}" | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          if [ "$(wc -l < SHA256SUMS.txt)" -ne "${#installers[@]}" ]; then
            echo "::error::Checksum list does not contain exactly one line per installer"
            exit 1
          fi
          cd ..
          cp .github/release-template.fr.md release-body.md
          sed '/<!-- SHA256SUMS -->/r release-artifacts/SHA256SUMS.txt' release-body.md > release-body-with-checksums.md
          sed -i '/<!-- SHA256SUMS -->/d' release-body-with-checksums.md
      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="ENISo $GITHUB_REF_NAME" \
            -f body="$(<release-body-with-checksums.md)" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true
      - name: Upload release assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
      - name: Verify uploaded installers match SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verified-assets
          while read -r _hash asset; do
            gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir verified-assets --clobber
          done < release-artifacts/SHA256SUMS.txt
          (
            cd verified-assets
            sha256sum -c ../release-artifacts/SHA256SUMS.txt
          )
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
