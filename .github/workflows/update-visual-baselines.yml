name: Update visual DOCX baselines

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-visual-docx-baselines
  cancel-in-progress: false

env:
  NODE_VERSION: '22.22.3'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install document rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreoffice-writer=4:24.2.7-0ubuntu0.24.04.7 \
            poppler-utils=24.02.0-1ubuntu9.11 \
            fonts-liberation=1:2.1.5-3 \
            fontconfig=2.15.0-1.1ubuntu2
      - run: npm ci
      - run: npm run test:visual:update -w apps/api -- --yes
      - run: npm run test:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-docx-baselines
          path: apps/api/test/visual/baselines/*.png
          if-no-files-found: error

  create-pull-request:
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.2
        with:
          name: visual-docx-baselines
          path: apps/api/test/visual/baselines
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-visual-docx-baselines
          delete-branch: true
          add-paths: apps/api/test/visual/baselines/*.png
          commit-message: 'test: update visual DOCX baselines'
          title: 'test: update visual DOCX baselines'
          body: |
            ## Summary
            <!-- What changed and why? -->
            Regenerate the seven synthetic DOCX visual references on `ubuntu-24.04` with pinned LibreOffice Writer, Poppler, and Liberation font packages.

            ## How tested
            <!-- Commands run, screenshots, etc. -->
            - `npm run test:visual:update -w apps/api -- --yes` — passed.
            - `npm run test:visual` — passed.

            ## Screenshots (if UI or .docx layout changed)
            <!-- Before/after or attach generated .docx files -->
            The PNG baseline changes are the visual output for review; no application layout code changes are included.

            ## Checklist
            - [ ] `npm run build` passes with 0 errors
            - [ ] `npm run build -w apps/desktop` passes with 0 errors
            - [ ] `npm test` passes (rooms vs teachers parity check)
            - [x] No secrets, `.env` files, or private data committed
            - [x] French used for UI strings; English for code/comments
