name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Keep a visible status check while only running visual work for relevant changes ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.filter.outputs.visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            visual:
              - 'apps/api/src/export/**'
              - 'apps/api/src/parser/**'
              - 'apps/api/test/fixtures/**'
              - 'apps/api/test/visual/**'
              - 'apps/api/vitest*.config.ts'
              - 'apps/api/package.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/update-visual-baselines.yml'

  # ── DOCX visual regression ────────────────────────────────────────
  visual-docx:
    name: Visual DOCX
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install document rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-writer poppler-utils fonts-liberation fontconfig
      - run: npm ci
      - run: npm run test:visual
      - name: Summarize visual failures
        if: failure()
        shell: bash
        run: |
          {
            echo '## Visual DOCX failures'
            if [[ -d apps/api/test-output/visual ]]; then
              mapfile -t failures < <(find apps/api/test-output/visual -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
              if (( ${#failures[@]} )); then
                printf -- '- %s\n' "${failures[@]}"
              else
                echo '- No per-case image directory was produced; inspect the test log.'
              fi
            else
              echo '- No per-case image directory was produced; inspect the test log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-docx-failures
          path: apps/api/test-output/visual
          if-no-files-found: warn
          retention-days: 7

  # ── Typecheck + Build + Unit Tests ─────────────────────────────────
  checks:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest
    env:
      # Electron binary is not needed for typecheck/build/test
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage -w apps/api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

  # ── API Integration Test (with PostgreSQL) ─────────────────────────
  api-integration:
    name: API Integration
    runs-on: ubuntu-latest
    needs: checks
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgres://enis:enis@127.0.0.1:5432/enis_timetable
      TZ: UTC
      LANG: C.UTF-8
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: enis
          POSTGRES_PASSWORD: enis
          POSTGRES_DB: enis_timetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U enis"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration -w apps/api

  # ── Browser E2E (Chromium) ─────────────────────────────────────────
  e2e:
    name: End-to-end · Chromium
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgres://enis:enis@127.0.0.1:5432/enis_timetable
      TZ: UTC
      LANG: C.UTF-8
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: enis
          POSTGRES_PASSWORD: enis
          POSTGRES_DB: enis_timetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U enis"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ── Electron Packaging Smoke Test (Windows) ────────────────────────
  package-smoke:
    name: Package Smoke (Windows)
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build -w apps/desktop
      - run: npm run stage -w apps/desktop
      - name: Electron Builder (unpacked)
        working-directory: apps/desktop
        run: npx electron-builder --dir --win
