name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Typecheck + Build + Unit Tests ─────────────────────────────────
  checks:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest
    env:
      # Electron binary is not needed for typecheck/build/test
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgres://enis:enis@127.0.0.1:5432/enis_timetable
      TZ: UTC
      LANG: C.UTF-8
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: enis
          POSTGRES_PASSWORD: enis
          POSTGRES_DB: enis_timetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U enis"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:coverage -w apps/api
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

  # ── Browser E2E (Chromium) ─────────────────────────────────────────
  e2e:
    name: End-to-end · Chromium
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgres://enis:enis@127.0.0.1:5432/enis_timetable
      TZ: UTC
      LANG: C.UTF-8
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: enis
          POSTGRES_PASSWORD: enis
          POSTGRES_DB: enis_timetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U enis"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ── Electron Packaging Smoke Test (Windows) ────────────────────────
  package-smoke:
    name: Package Smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build -w apps/desktop
      - run: npm run stage -w apps/desktop
      - name: Electron Builder (unpacked)
        working-directory: apps/desktop
        run: npx electron-builder --dir --win
